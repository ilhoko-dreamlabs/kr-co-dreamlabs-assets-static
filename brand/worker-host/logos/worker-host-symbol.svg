<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Worker Host symbol</title>
  <desc id="desc">Candidate DreamLabs Worker Host symbol with a routed W mark.</desc>
  <defs>
    <linearGradient id="worker-host-bg" x1="30" y1="20" x2="226" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="0.58" stop-color="#123846"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
